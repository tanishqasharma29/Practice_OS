name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib qemu-system-x86 python3
      - run: make
      - run: make test-host
      - run: make test-qemu
